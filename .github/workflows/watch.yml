# ACTIVE polling. Off until repo variable SEATWATCH_ACTIVE = true.
#   Activate:   gh variable set SEATWATCH_ACTIVE --body true
#   Deactivate: gh variable set SEATWATCH_ACTIVE --body false
# Skipped jobs use no Actions minutes.
# Repo MUST be public: ~1,350 runner-min/day. Private free tier (2,000/mo) dies in ~1.5 days.
name: seatwatch
on:
  schedule: [{cron: "*/30 * * * *"}]   # backup only — GitHub delays cron by hours; the chain step below keeps it running
  workflow_dispatch:
permissions: {contents: write, actions: write}
jobs:
  # Backup cron only starts polling if the self-chain died. Otherwise it exits as
  # "skipped" (no "run cancelled" emails from GitHub).
  guard:
    runs-on: ubuntu-latest
    outputs: {go: "${{ steps.g.outputs.go }}"}
    steps:
      - id: g
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo go=true >> $GITHUB_OUTPUT; exit 0; fi
          n=$(gh run list -R ${{ github.repository }} -w watch.yml --json databaseId,status \
              --jq '[.[] | select(.databaseId != ${{ github.run_id }} and (.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting"))] | length')
          echo "other active runs: $n"
          [ "$n" = "0" ] && echo go=true >> $GITHUB_OUTPUT || echo go=false >> $GITHUB_OUTPUT
  run:
    needs: guard
    if: needs.guard.outputs.go == 'true' && (vars.SEATWATCH_ACTIVE == 'true' || github.event_name == 'workflow_dispatch')
    concurrency: {group: seatwatch, cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python seatwatch.py --minutes 50
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      - name: persist state
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f state.json && git commit -m "state [skip ci]" && git pull --rebase && git push || true
      - name: chain next run (continuous polling)
        if: always() && vars.SEATWATCH_ACTIVE == 'true'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run watch.yml --ref ${{ github.ref_name }} -R ${{ github.repository }}
