# Free cloud runner. GitHub cron min = 5 min and often delayed — use a VPS/Pi for <1 min.
name: seatwatch
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python seatwatch.py --once
      - name: persist state
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f state.json && git commit -m "state" && git push || true
