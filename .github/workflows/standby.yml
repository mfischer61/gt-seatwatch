# STANDBY. Runs once a day while seatwatch is dormant.
# Only checks whether a watch_terms schedule (e.g. Spring 2027) has posted → Telegram alert.
# ~30 Actions minutes/month. Stops itself once SEATWATCH_ACTIVE = true.
name: standby
on:
  schedule: [{cron: "17 13 * * *"}]   # ~9:17am ET daily
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: seatwatch, cancel-in-progress: false}
jobs:
  standby:
    if: vars.SEATWATCH_ACTIVE != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: restore state (from 'state' branch)
        run: git fetch -q --depth=1 origin state && git show FETCH_HEAD:state.json > state.json || echo "no saved state yet"
      - run: python seatwatch.py --standby
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      - name: persist state (to 'state' branch, keeps main history clean)
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name bot; git config user.email bot@users.noreply.github.com
          blob=$(git hash-object -w state.json)
          tree=$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree)
          c=$(git commit-tree "$tree" -m "standby state [skip ci]")
          git push -q -f origin "$c:refs/heads/state" || true
