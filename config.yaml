# Term code YYYYSS: 02 = Spring, 05 = Summer, 08 = Fall
term: 202702

# Sections to watch — CRN: label   (Spring 2027, set 2026-11-05)
crns:
  27885: ECE 3600 A (Cyber req) TR 5:00-6:15 Ji
  28262: ECE 4117 A (Cyber elec) TR 3:30-4:45 Saltaformaggio (+lab 28263) — thread-restricted until Dec 21 noon
  23934: ECE 4180 A (CHEA elec) MW 3:30-4:45 Fratta (+lab 26776)
  24324: ECE 4180 B (CHEA elec) TR 3:30-4:45 Fratta (+lab 27083)

# Whole courses: alert on NEW sections (+ seats opening in any section)
courses:
  - ECE 3600
  - ECE 4117
  - ECE 4180

# Courses you're REGISTERED in → your CRN. Alerts (no seat noise):
#   🔀 new section appears (other time/prof) — urgent, with clash check vs your other classes
#   ✏️ prof/time change on your section (urgent) or another section (Telegram only)
enrolled:
  ECE 3058: 28256    # A TR 8:00-9:15 Brothers (lab AL 28257)
  ECE 3030: 26114    # A TR 2:00-3:15 Narayanan
  PHIL 3109: 32178   # CC MW 9:30-10:20 Clinkenbeard

# Registration date reminders → Telegram + email once at `at` (ET). Skipped if >6h late.
reminders:
  - at: "2026-11-13 11:45"
    title: ECE 3005 opens at noon
    msg: "Senior hold lifts at NOON. Register ECE 3005 A CRN 26857 (WF 11:00). Backup C 34811 (WF 9:30). B clashes with 3058."
  - at: "2026-11-23 13:30"
    title: Waitlists pause 5:30 PM
    msg: "Waitlist offers pause 5:30 PM today until Nov 30 9 AM. Accept any pending offer (ECE 3600 / ECE 4180) now."
  - at: "2026-11-30 08:55"
    title: Waitlists resume 9 AM
    msg: "Waitlist offers resume 9 AM. Watch GT email; offers expire. ECE 3600 27885 / ECE 4180."
  - at: "2026-12-16 09:00"
    title: Phase I ends tomorrow
    msg: "Phase I ends Dec 17/18; waitlists pause Dec 18 9 AM. Finalize Spring 2027 schedule in OSCAR."
  - at: "2026-12-17 09:00"
    title: Phase I ends today
    msg: "Last Phase I day. Confirm Spring 2027 schedule in OSCAR."
  - at: "2026-12-21 11:45"
    title: Thread restrictions lift at noon
    msg: "NOON: add Cybersecurity thread in OSCAR (drop DSSD), then register ECE 4117 A 28262 + lab 28263."

# Alert the moment a future term's schedule appears
watch_terms:
  - 202708     # Fall 2027

# Courses you're already waitlisted in: no waitlist-spot alerts; freed seat = urgent
on_waitlist:
  - ECE 3600
  - ECE 4180

waitlist_alerts: true        # alert when a waitlist spot opens on a full section
alert_on_any_change: false   # count-only changes (waitlist 13→14 etc.) = no alert
course_seat_alerts: true     # courses: alert when a section opens
course_any_change: false     # courses: every count change (noisy)
daily_summary_hour: 8        # daily status message after 8am (proves it's alive); null = off
timezone: America/New_York
interval_seconds: 60         # local loop; keep >= 30
state_file: state.json

notify:
  # Telegram creds go in .env (local) or GitHub secrets — not here.
  telegram_bot_token: ""
  telegram_chat_id: ""
  ntfy_topic: ""
  discord_webhook: ""
  email:
    to: ""
    user: ""
    app_password: ""
